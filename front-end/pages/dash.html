<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Visão Geral </h1>
    <!----h1 é o titulo principal da pagina--->
   <section class="metricas">
     <!----section agrupa conteudos relacionados--->
    <div class="card card-alerta">
         <!---div é uma caixa generica usada aqui para separar cada metrica no seu bloco--->
        <h3>Produtos com Estoque Baixo</h3>
        <!--- h3 é cada é o rotulo de cada metrica--->
        <p class="numero">0</p>
    </div>

    <div class="card card-info">
        <h3>Quantidade de Produtos no Estoque</h3>
        <p class="numero">0</p>
    </div>

    <div class="card card-sucesso">
        <h3>Custo Total de Produtos</h3>
        <p class="numero">R$ 0</p>
    </div>
</section>

<section class="atalhos">
    <h2>Atalhos</h2>

    <div class="atalhos-grid">
        <div class="atalho-card">
            <h3>Produtos</h3>
            <p>Cadastro de produtos</p>
        </div>

        <div class="atalho-card">
            <h3>Entradas</h3>
            <p>Gerenciar entradas de produtos no estoque</p>
        </div>

        <div class="atalho-card">
            <h3>Saídas</h3>
            <p>Gerenciar saídas de produtos no estoque</p>
        </div>
    </div>
</section>
    
</body>
</html>
