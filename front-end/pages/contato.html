<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <!-- Fonte Google Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/contato.css">
</head>
<body>

    <main class="contact-container">
        <div class="form-header">
            <h1>Entre em Contato</h1>
            <p>Preencha o formulário abaixo e envie sua mensagem</p>
        </div>

        <form action="#" method="POST" class="contact-form">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(85) 99999-9999">
            </div>

            <div class="form-group">
                <label for="assunto">Assunto</label>
                <select name="assunto" id="assunto" required>
                    <option value="" selected disabled>Selecione um assunto</option>
                    <option value="orcamento">Solicitação de orçamento</option>
                    <option value="suporte">Suporte técnico</option>
                    <option value="desenvolvimento">Desenvolvimento de sistema</option>
                    <option value="consultoria">Consultoria</option>
                    <option value="outro">Outro assunto</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem aqui..." required></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Enviar mensagem</button>
                <button type="reset" class="btn btn-secondary">Limpar</button>
            </div>
        </form>
    </main>

</body>
</html>
